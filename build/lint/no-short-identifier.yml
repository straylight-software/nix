# straylight policy: no abbreviations under 4 characters
# The "three-letter rule" - cfg, conn, res, etc. are banned
id: no-short-identifier-cfg
language: cpp
severity: warning
message: "Avoid short abbreviation 'cfg' - use 'config' or 'configuration'"
note: "Three-letter rule: abbreviations under 4 characters create confusion"
rule:
  kind: identifier
  regex: '\bcfg\b'
