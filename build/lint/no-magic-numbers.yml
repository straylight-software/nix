# straylight policy: name your constants
# Magic numbers should be named constants
id: magic-number-256
language: cpp
severity: hint
message: "Consider naming this constant (256 often means buffer size)"
note: "Magic numbers should be constexpr named constants"
rule:
  kind: number_literal
  regex: '^256$'
  not:
    inside:
      any:
        - kind: enum_specifier
        - kind: field_declaration
