# Hypermodern C++: Use nullptr instead of NULL or 0
id: prefer-nullptr-null
language: cpp
severity: warning
message: "Use nullptr instead of NULL"
note: "nullptr is type-safe, NULL is a macro that may be defined as 0"
rule:
  pattern: NULL
  inside:
    any:
      - kind: assignment_expression
      - kind: return_statement
      - kind: argument_list
      - kind: binary_expression
      - kind: conditional_expression
fix: "nullptr"
