 Static analysis with cppcheck. Catches what clang-tidy misses.
 Run after clang-tidy in the lint pipeline.

 Usage: cppcheck -\-project=cppcheck.cfg -\-suppressions-list=.cppcheck

 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<project version="1">
  <!-- Source paths to analyze -->
  <paths>
    <dir name="src/nix"/>
    <dir name="src/straylight"/>
  </paths>

  <!-- Excluded paths (vendor, generated, third-party) -->
  <exclude>
    <path name="vendor/"/>
    <path name="buck-out/"/>
    <path name="build/"/>
  </exclude>

  <!-- Include paths for header resolution -->
  <includedir>
    <dir name="src/nix/include"/>
    <dir name="src/straylight/nix/include"/>
  </includedir>

  <!-- Platform settings -->
  <platform>unix64</platform>

  <!-- C++ standard -->
  <std>c++23</std>

  <!-- Analysis settings -->
  <analyze-all-vs-configs>false</analyze-all-vs-configs>
  <check-headers>true</check-headers>
  <check-unused-templates>true</check-unused-templates>
  <max-ctu-depth>2</max-ctu-depth>
  <max-template-recursion>100</max-template-recursion>

  <!-- Libraries to load for additional checks -->
  <libraries>
    <library>std</library>
    <library>posix</library>
  </libraries>
</project>
